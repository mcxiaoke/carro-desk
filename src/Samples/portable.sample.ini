# ScreenLock 便携模式标志文件
# 
# 使用方式：
# 将本文件重命名为 portable.ini（或在 ScreenLock.exe 同目录下新建名为 portable.ini 的空文件）。
# 
# 效果说明：
# 1. 当 ScreenLock.exe 同目录下存在 portable.ini 时，程序自动启用便携模式。
# 2. 所有数据和配置文件都会存放在 exe 目录下的 app_data 子目录中（例如：<exe目录>\app_data\config.json、tasks.json、logs\、scripts\）。
# 3. 后续更新升级软件时，直接覆盖 exe 与程序文件即可，不会影响或误覆盖 app_data 中的配置与数据。
# 4. 若不存在 portable.ini，则默认为漫游模式，数据存放在 %AppData%\ScreenLock 目录中。
