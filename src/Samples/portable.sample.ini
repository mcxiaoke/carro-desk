# CarroDesk 便携模式标志文件 (portable.sample.ini)
# 
# 使用方式：
# 将本文件复制或重命名为 portable.ini（或在 CarroDesk.exe 同目录下新建一个名为 portable.ini 的空文件即可）。
# 
# 效果说明：
# 1. 当 CarroDesk.exe 同目录下存在 portable.ini 时，程序自动启用便携绿化模式。
# 2. 所有数据和配置文件都会存放在 exe 目录下的 app_data 子目录中：
#    - <exe目录>\app_data\config.json  （主配置文件）
#    - <exe目录>\app_data\tasks.json   （自动化任务定义文件）
#    - <exe目录>\app_data\scripts\     （任务脚本存放目录）
#    - <exe目录>\app_data\logs\        （运行日志目录）
# 3. 后续更新升级软件时，直接覆盖 exe 与程序主文件即可，绝不会影响或误覆盖 app_data 中的配置与历史数据。
# 4. 若不存在 portable.ini，则默认为 Windows 标准漫游模式，数据存放在 %AppData%\CarroDesk 目录中。
